<!DOCTYPE html>  
<html lang="fa">  

<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>لیست دوره‌ها</title>  
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css">  
    <style>  
        body {  
            background-color: #f8f9fa;  
        }  

        .course {  
            margin-bottom: 20px;  
            transition: transform 0.3s;  
        }  

        .course:hover {  
            transform: translateY(-4px);  
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);  
        }  

        .card {  
            border: none;  
            border-radius: 10px;  
        }  

        .card-body {  
            padding: 20px;  
        }  

        .search-box {  
            margin-bottom: 20px;  
        }  

        .navbar-brand,  
        .nav-link {  
            color: #000 !important; 
        }  

    </style>  
</head>  

<body>   
    <nav class="navbar navbar-expand-lg">  
        <div class="container">  
            <a class="navbar-brand" href="#">khanjary</a>  
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"  
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">  
                <span class="navbar-toggler-icon"></span>  
            </button>  
            <div class="collapse navbar-collapse" id="navbarNav">  
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">  
                        <a class="nav-link active" aria-current="page" href="#">خانه</a>  
                    </li>
                </ul>  
            </div>  
        </div>  
    </nav>  

    <div class="container mt-5">  
        <h1 class="text-center mb-4">لیست دوره‌ها</h1>   
        <div class="row">  
            {% for course in courses %}  
            <div class="col-md-4">  
                <div class="card course text-center">  
                    <div class="card-body d-flex flex-column justify-content-center">  
                        <h2 class="card-title mb-3">{{ course.title }}</h2>  
                        <p class="card-text text-muted">{{ course.description }}</p>  
                        <a href="{% url 'course_detail' course.id %}" class="btn btn-primary">جزئیات دوره</a>  
                    </div>  
                </div>  
            </div>  
            {% if forloop.counter|divisibleby:3 and not forloop.last %}  
        </div>  
        <div class="row">  
            {% endif %}  
            {% endfor %}  
        </div>  
    </div>  

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>  
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>  
</body>  

</html>
