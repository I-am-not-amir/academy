<!DOCTYPE html>  
<html lang="fa">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>صفحه پیدا نشد - 404</title>  
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/5.1.3/css/bootstrap.min.css">  
    <style>  
        body {  
            background-color: #f8f9fa;  
        }  
        .container {  
            height: 100vh;  
            display: flex;  
            justify-content: center;  
            align-items: center;  
        }  
        .error-content {  
            text-align: center;  
            background-color: #fff;  
            border-radius: 15px;  
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);  
            padding: 40px;  
            width: 100%;  
            max-width: 600px;  
        }  
        .error-code {  
            font-size: 80px;  
            color: #28a745;  
        }  
        .home-button {  
            margin-top: 20px;  
        }  
    </style>  
</head>  
<body>  
    <div class="container">  
        <div class="error-content">  
            <h1 class="error-code">404</h1>  
            <h2>اوه! صفحه مورد نظر شما پیدا نشد.</h2>  
            <p>به نظر می‌رسد صفحه‌ای که به دنبال آن هستید وجود ندارد یا ممکن است حذف شده باشد.</p>  
            <a href="/" class="btn btn-success home-button">بازگشت به صفحه اصلی</a>
        </div>  
    </div>  

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>  
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>  
</body>  
</html>
